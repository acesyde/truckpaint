name: Pre-release

# Publishes a pre-release from any branch, never as the Latest release. Run it
# from the Actions tab (Run workflow, on the branch to build), or with `gh
# workflow run prerelease.yml --ref feat/gradients -f tag=v0.2.0-beta.1`. The
# branch must contain the workflow files. Releases have their own workflow:
# see release.yml.
#
# Nothing starts when a tag is pushed: the tag is created by GitHub when the
# release is published. Releases are immutable once published, so untick
# `publish` to leave a draft and look at it first.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release: v and a version with a suffix (v0.2.0-beta.1)"
        type: string
        required: true
      publish:
        description: Publish the pre-release (untick to leave a draft to review first)
        type: boolean
        default: true

# A tag is released once at a time; a second run waits instead of cancelling.
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check the request
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.guard.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      # A valid version with a suffix, from any branch.
      - name: Check the request
        id: guard
        env:
          TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! bash scripts/release-guard.sh prerelease "$TAG" "$REF_TYPE" "$REF_NAME"; then
            echo "::error::The request was refused: see the message above."
            exit 1
          fi

      # 2 means "no such tag": the tag is free. A published release keeps its
      # tag name for good, so an existing tag is refused.
      - name: Check the tag does not exist
        env:
          TAG: ${{ inputs.tag }}
        run: |
          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null || status=$?
          case "$status" in
            2) echo "The tag $TAG is free." ;;
            0)
              echo "::error::The tag $TAG already exists, so it cannot be released again. A published release is permanent: use the next version, for example the next beta number."
              exit 1
              ;;
            *)
              echo "::error::Could not look for the tag $TAG (git exited with $status)."
              exit 1
              ;;
          esac

  prerelease:
    name: Pre-release
    needs: check
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.check.outputs.version }}
      prerelease: true
      publish: ${{ inputs.publish }}
