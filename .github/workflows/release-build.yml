name: Release build

# Builds the downloads of a release or pre-release and publishes it. Called by
# release.yml and prerelease.yml, which check the request first.
#
# The release is a draft until all three downloads are attached and attested,
# so a failed build never leaves a public release with a missing download. With
# immutable releases, files can only be added to a draft: once published, the
# tag and the files are locked. `publish` unticked leaves the draft to review.
# Running the workflow again for the same tag, before it is published,
# completes it.

on:
  workflow_call:
    inputs:
      version:
        description: The tag without its `v` (0.2.0, 0.2.0-beta.1)
        type: string
        required: true
      prerelease:
        description: Publish as a pre-release (never the Latest release)
        type: boolean
        required: true
      publish:
        description: Publish the release when it is built (false leaves a draft)
        type: boolean
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # `mise run` would otherwise install every tool in mise.toml; the build only
  # needs Rust, installed by mise-action below.
  MISE_TASK_RUN_AUTO_INSTALL: "false"

defaults:
  run:
    # Same shell on every runner (Git Bash on Windows).
    shell: bash

jobs:
  package:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-latest
          - platform: windows-x86_64
            os: windows-latest
          # macos-latest is Apple silicon (arm64); no Intel download is published.
          - platform: macos-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      # The commit the run started on, so a branch that moves during the build
      # cannot mix two commits.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libgl1-mesa-dev

      # Keep `version` in sync with ci.yml and the mise used locally.
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.3
          install_args: rust

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true

      - name: Package
        env:
          TRUCKPAINT_VERSION: ${{ inputs.version }}
        run: mise run package

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-${{ matrix.platform }}
          path: dist/truckpaint-*
          if-no-files-found: error

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    # Only this job writes: the downloads are attested (id-token, attestations)
    # and attached to the release (contents).
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: v${{ inputs.version }}
      PRERELEASE: ${{ inputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # Every tag: the notes start at the last stable one.
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: package-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: |
          cat truckpaint-*.sha256 > SHA256SUMS
          rm truckpaint-*.sha256
          cat SHA256SUMS
          ls -l

      - name: Notes start
        id: notes
        run: bash scripts/release-notes-start.sh "$TAG"

      # A draft for the built commit. A release with this tag can only be a
      # draft here (the request is refused when the tag exists, and a published
      # release has its tag): it is reused and pointed at this commit. GitHub
      # creates the tag when the release is published.
      - name: Draft
        env:
          START: ${{ steps.notes.outputs.start }}
        run: |
          set +e
          found=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>&1)
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            if [ "$found" != true ]; then
              echo "::error::The release $TAG is already published: files cannot be added to it."
              exit 1
            fi
            echo "The draft $TAG exists: reusing it for $GITHUB_SHA."
            gh release edit "$TAG" --target "$GITHUB_SHA"
          elif grep -q "release not found" <<< "$found"; then
            args=(--draft --target "$GITHUB_SHA" --title "$TAG" --generate-notes)
            [ -z "$START" ] || args+=(--notes-start-tag "$START")
            if [ "$PRERELEASE" = true ]; then args+=(--prerelease); else args+=(--latest); fi
            gh release create "$TAG" "${args[@]}"
          else
            echo "::error::Could not look for the release $TAG: $found"
            exit 1
          fi

      - name: Upload
        run: gh release upload "$TAG" dist/truckpaint-* dist/SHA256SUMS --clobber

      # The files that were just uploaded: the three archives and SHA256SUMS.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      # Last step: nothing is public before all the files are attached and
      # attested, and nothing is published when `publish` is unticked.
      - name: Publish
        if: inputs.publish
        run: |
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$TAG" --draft=false --prerelease=true --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest=true
          fi
          url=$(gh release view "$TAG" --json url --jq .url)
          echo "Published $url"
          echo "Published $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Draft ready
        if: ${{ !inputs.publish }}
        run: |
          url=$(gh release view "$TAG" --json url --jq .url)
          {
            echo "The draft $TAG is ready, with the three downloads and SHA256SUMS: $url"
            echo
            echo "Nothing is public and the tag does not exist yet. Look at it, then publish it"
            echo "in GitHub, or run this workflow again for the same tag with publish ticked."
            echo "A published release is permanent."
          } | tee -a "$GITHUB_STEP_SUMMARY"
