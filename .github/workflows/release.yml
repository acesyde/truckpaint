name: Release

# Pushing a tag vMAJOR.MINOR.PATCH publishes a release (the Latest one). Only a
# commit that is on `main` may be released. A tag with a suffix is a
# pre-release: see prerelease.yml.

on:
  push:
    # Matched against the whole tag name, so v0.2.0-beta.1 does not match.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# A tag is released once at a time; a second run waits instead of cancelling.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the commit must be found in `main`.
          fetch-depth: 0

      - name: Check the tag
        id: tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash scripts/release-tag.sh "$TAG" | tee tag.out >> "$GITHUB_OUTPUT"
          if ! grep -qx 'prerelease=false' tag.out; then
            echo "::error::$TAG is a pre-release tag, not a release."
            exit 1
          fi

      - name: Check the commit is on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is on a commit that is not on main ($GITHUB_SHA). A release comes from main: tag a commit of main, or use a pre-release tag (v1.2.3-beta.1). Delete the tag with: git push origin :refs/tags/$TAG"
            exit 1
          fi

  release:
    name: Release
    needs: check
    permissions:
      contents: write
    uses: ./.github/workflows/release-build.yml
    with:
      version: ${{ needs.check.outputs.version }}
      prerelease: false
