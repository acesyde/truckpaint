[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
tp-core = { path = "crates/tp-core" }
tp-ui = { path = "crates/tp-ui" }
tp-text = { path = "crates/tp-text" }
tp-file = { path = "crates/tp-file" }
tp-render = { path = "crates/tp-render" }
tp-i18n = { path = "crates/tp-i18n" }
tp-vehicles = { path = "crates/tp-vehicles" }
tp-pack = { path = "crates/tp-pack" }
tp-scs = { path = "crates/tp-scs" }
tp-mcp = { path = "crates/tp-mcp" }

eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "links", "persistence", "wayland", "x11"] }
egui = "0.36.2"
kurbo = "0.13.1"
flo_curves = "0.8.1"
i_overlay = "9.0.0"
cosmic-text = { version = "0.19.0", default-features = false, features = ["std", "fontconfig"] }
lyon_tessellation = "1.0.22"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
resvg = { version = "0.48.1", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
opener = { version = "0.9.0", default-features = false }
rfd = "0.17.2"
texpresso = { version = "2.0.2", features = ["rayon"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
blake3 = "1.8.7"
egui_kittest = { version = "0.36.2", features = ["wgpu", "snapshot"] }
egui-phosphor = "0.14.0"
directories = "6.0.0"
ron = "0.12.2"
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1.44"
log = "0.4.34"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2.5"
tempfile = "3"
fluent-bundle = "0.16.0"
fluent-syntax = "0.12.0"
unic-langid = { version = "0.9.6", features = ["macros"] }
sys-locale = "0.3.2"
semver = { version = "1.0.28", features = ["serde"] }
serde_json = "1.0.151"
tiny_http = "0.12.0"
base64 = "0.23.1"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSUserDefaults"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow", "NSToolbar"] }
muda = { version = "0.21.2", default-features = false }
arboard = { version = "3.6.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev.package."*"]
opt-level = 2
