[tools]
actionlint = "1.7.12"
code-review-graph = "2.3.8"
node = "24.21.0"
openspec = "1.13.0"
pnpm = "12.6.0"
rust = { version = "1.98.1", components = "rustfmt,clippy" }
shellcheck = "0.11.0"
uv = "0.12.15"

[tool_alias]
openspec = "npm:@fission-ai/openspec"

[settings]
minimum_release_age = "30d"
pin = true
npm.package_manager = "pnpm"

# --- Tasks (used locally and by CI) -------------------------------------------

[tasks.run]
description = "Run the desktop app (debug build)"
run = "cargo run -p tp-app"

[tasks.fmt]
description = "Format all Rust code"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check Rust formatting"
run = "cargo fmt --all --check"

[tasks.lint]
description = "Run clippy on all targets, warnings denied"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.test]
description = "Run the test suite (unit + headless UI tests)"
run = "cargo test --workspace --locked"

[tasks."test:release"]
description = "Run the test suite in release mode (shares artifacts with `build`)"
run = "cargo test --workspace --release --locked"

[tasks.build]
description = "Build the workspace in release mode"
run = "cargo build --workspace --release --locked"

[tasks.screenshots]
description = "Render key screens to target/screenshots (needs a GPU)"
run = "cargo test -p tp-app --test screenshots -- --ignored"

[tasks.pack]
description = "Pack a vehicle folder into a .tpv: mise run pack <folder> [-o file.tpv]"
dir = "{{cwd}}"
run = "cargo run -q --manifest-path {{config_root}}/Cargo.toml -p tp-pack --bin tpv -- pack"

[tasks.sample-vehicles]
description = "Rebuild the committed sample vehicle packages from examples/vehicles/<sample>/<version>"
run = """
set -e
cd examples/vehicles
for src in */*/; do
  cargo run -q --manifest-path ../../Cargo.toml -p tp-pack --bin tpv -- pack "$src"
done
"""

[tasks."doc:media"]
description = "Render the documentation's screenshots and animations (needs a GPU): mise run doc:media [section]"
tools = { ffmpeg = "8.1.2" }
usage = 'arg "[section]" help="One section (getting-started, vehicles, fleet, workshop, brand, export, ai-assistant)"'
run = 'bash scripts/doc-media.sh "${usage_section:-}"'

[tasks."doc:tokens"]
description = "Write the documentation site's color tokens from tp-ui (website/src/styles/tokens.css)"
run = "cargo run -q -p tp-ui --example tokens_css"

[tasks."doc:dev"]
description = "Preview the documentation site locally, with live reload"
dir = "website"
run = "pnpm install --frozen-lockfile && pnpm dev"

[tasks."doc:build"]
description = "Build the documentation site into website/dist (as CI does)"
dir = "website"
run = "pnpm install --frozen-lockfile && pnpm build"

[tasks."ci:changes"]
description = "Print code=true|false: whether BASE..HEAD changes more than docs (CI gating)"
run = "bash scripts/ci-changes.sh {{arg(name='base', default='')}} {{arg(name='head', default='HEAD')}}"

[tasks."ci:changes:test"]
description = "Self-test of the ci:changes detection on a throwaway Git repository"
run = "bash scripts/ci-changes-test.sh"

[tasks."release:tag"]
description = "Check a release tag and print version= and prerelease=: mise run release:tag -- v0.2.0"
run = "bash scripts/release-tag.sh"

[tasks."release:notes-start"]
description = "Print start=<last stable tag below TAG> for the release notes: mise run release:notes-start -- v0.2.0"
run = "bash scripts/release-notes-start.sh"

[tasks."release:test"]
description = "Self-test of the release tag checks on a throwaway Git repository"
run = "bash scripts/release-test.sh"

[tasks."lint:workflows"]
description = "Lint the GitHub workflows (actionlint, which also runs shellcheck on their scripts) and the shell scripts"
run = ["actionlint", "shellcheck scripts/*.sh"]

[tasks.package]
description = "Build and pack this platform's download into dist/ (version from TRUCKPAINT_VERSION, `dev` when unset)"
run = "bash scripts/package.sh"

[tasks."package:test"]
description = "Self-test of the package script with a stand-in program (nothing is compiled)"
run = "bash scripts/package-test.sh"

[tasks.ci]
description = "Everything CI runs, in order"
run = [
  { task = "fmt:check" },
  { task = "lint" },
  { task = "test" },
  { task = "build" },
]
